<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>确认批量投稿</title>
  <style>
    body { font: 16px/1.5 sans-serif; margin: 2rem auto; max-width: 42rem; padding: 0 1rem; }
    code, pre { font-family: ui-monospace, monospace; }
    pre { white-space: pre-wrap; word-break: break-all; background: #f4f4f4; padding: 0.75rem; }
    button { font: inherit; padding: 0.4rem 0.8rem; }
    .warn { color: #8a1f11; }
  </style>
</head>
<body>
  <h1>确认批量投稿</h1>
  <p>请先登录普通管理员账号。对照本地 <code>plan</code> 打印的完整摘要，确认后再签发上传授权。这一步不会公开作品。</p>
  <form id="lookup">
    <label>确认码 <input id="code" autocomplete="off" required></label>
    <button type="submit">查看摘要</button>
  </form>
  <div id="out"></div>
  <script src="/admin/batch.js"></script>
</body>
</html>
