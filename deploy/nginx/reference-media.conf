# Include inside the API HTTPS server block (api.arenaofbias.icu, listen 443).
# Question reference images go back to the API, which checks access on every read:
# drafts and pending questions are never in COS, so the CDN 301 would 404 for them.
# Images of public questions are also dual-written to COS for the Gallery CDN path.
# Every other /media/ path (up-* works) keeps the existing `location ^~ /media/` 301.
# nginx picks the longest matching prefix, and ^~ stops regex locations (such as
# BaoTa's image `expires` block) from taking over, so block order does not matter.
location ^~ /media/references/ {
    proxy_pass http://127.0.0.1:5273;
    include /www/wwwroot/arenaofbias-server/deploy/nginx/api-proxy.conf;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
}
location ^~ /media/pack-references/ {
    proxy_pass http://127.0.0.1:5273;
    include /www/wwwroot/arenaofbias-server/deploy/nginx/api-proxy.conf;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
}
