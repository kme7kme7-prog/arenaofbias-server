[Unit]
Wants=arenaofbias-capture.service
After=arenaofbias-capture.service

[Service]
User=arenaofbias
Group=arenaofbias
SupplementaryGroups=aob-capture
StateDirectory=arenaofbias
StateDirectoryMode=0700
Environment=HOME=/var/lib/arenaofbias
Environment=CAPTURE_ENDPOINT_FILE=/run/aob-capture/endpoint
NoNewPrivileges=yes
CapabilityBoundingSet=
ProtectSystem=strict
ReadWritePaths=/www/wwwroot/arenaofbias-server/.data
ProtectHome=yes
PrivateTmp=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectControlGroups=yes
