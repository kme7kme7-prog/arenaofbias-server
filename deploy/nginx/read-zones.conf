# Include once in http {}, before the vhost includes.
map $request_method $aob_read_ip {
    default "";
    GET  $binary_remote_addr;
    HEAD $binary_remote_addr;
}

# Intake exports retain the backend's dedicated capability token/IP limits.
map $uri $aob_public_read_ip {
    default $aob_read_ip;
    ~^/api/curate/export/ "";
}

# URI is normalized and excludes query strings. All hosts share these keys.
map $uri $aob_catalog_ip {
    default "";
    /data.json         $aob_read_ip;
    /api/bootstrap     $aob_read_ip;
    /api/show1/works    $aob_read_ip;
    /api/works         $aob_read_ip;
    /api/prompts       $aob_read_ip;
    /api/votes         $aob_read_ip;
    /api/ratings       $aob_read_ip;
    /api/leaderboard   $aob_read_ip;
    /api/guess/today   $aob_read_ip;
}

map $uri $aob_page_ip {
    default "";
    ~/$        $aob_read_ip;
    ~*\.html?$ $aob_read_ip;
}

map $uri $aob_model_ip {
    default "";
    ~*\.(sbox|glb|gltf|zip)$ $aob_read_ip;
}

# Preserve readable API 429 errors for the two official frontends.
map $http_origin $aob_error_origin {
    default "";
    ~^https://(www\.|gallery\.)?arenaofbias\.icu$ $http_origin;
}

limit_req_zone  $aob_public_read_ip zone=aob_read_files:10m rate=20r/s;
limit_req_zone  $aob_catalog_ip zone=aob_read_catalog:10m rate=30r/m;
limit_req_zone  $aob_page_ip    zone=aob_read_pages:10m   rate=60r/m;
limit_req_zone  $aob_model_ip   zone=aob_read_models:10m  rate=120r/m;
limit_conn_zone $aob_public_read_ip zone=aob_read_conn:10m;
