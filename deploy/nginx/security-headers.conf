# Include at server level and in every location that adds its own response headers.
# $aob_frontend_csp is empty on API/work hosts, preserving their individual CSPs.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Content-Security-Policy $aob_frontend_csp always;
