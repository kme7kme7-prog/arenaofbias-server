# Include inside each official site/API/work server {}, preserving existing routes.
limit_req zone=aob_read_files   burst=200 nodelay;
limit_req zone=aob_read_catalog burst=15  nodelay;
limit_req zone=aob_read_pages   burst=30  nodelay;
limit_req zone=aob_read_models  burst=40  nodelay;
limit_conn aob_read_conn 64;
limit_req_status 429;
limit_conn_status 429;

error_page 429 = @aob_read_limited;
location @aob_read_limited {
    include /www/wwwroot/arenaofbias-server/deploy/nginx/security-headers.conf;
    default_type application/json;
    add_header Retry-After 30 always;
    add_header Cache-Control "no-store" always;
    add_header Access-Control-Allow-Origin $aob_error_origin always;
    add_header Access-Control-Allow-Credentials "true" always;
    add_header Vary Origin always;
    return 429 '{"error":"读取太频繁，请稍后再试"}';
}
