# Include inside frontend server {} before the site's other regex locations.
# Keep ACME challenges accessible; hidden repository/environment files stay private.
location ~ (^|/)\.(?!well-known(?:/|$)) {
    return 404;
}
location = /robots.txt {
    try_files $uri =404;
}
location = /favicon.ico {
    try_files $uri =404;
}
location ~* ^/(AGENTS\.md|HANDOFF\.md|package(-lock)?\.json|yarn\.lock|pnpm-lock\.yaml)$ {
    return 404;
}
