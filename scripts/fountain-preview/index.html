<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>古典庭园喷泉 · 3D 小模型</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
    body { font-family: system-ui, sans-serif; color: #344342; background: #f0eee7; }
    main { height: 100svh; display: grid; grid-template-rows: auto 1fr auto; }
    header { padding: 24px 30px 0; }
    h1 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: .08em; }
    header p { margin: 8px 0 0; color: #7b8580; font-size: 12px; letter-spacing: .08em; }
    #stage { min-height: 0; position: relative; touch-action: none; }
    canvas { display: block; width: 100%; height: 100%; }
    #status { position: absolute; inset: 0; display: grid; place-content: center; padding: 24px; text-align: center; font-size: 14px; }
    #status[hidden] { display: none; }
    footer { display: flex; justify-content: center; align-items: center; flex-wrap: wrap; gap: 10px; padding: 0 20px 22px; }
    button { color: #344342; background: #faf9f5; border: 1px solid #d3d9d2; border-radius: 24px; padding: 10px 18px; font: inherit; font-size: 12px; cursor: pointer; }
    button:hover { background: #fff; border-color: #7d9e92; }
    button:disabled { opacity: .5; cursor: wait; }
    #export { background: #345c50; color: #fff; border-color: #345c50; }
    .hint { color: #849087; font-size: 11px; }
    body.capture main { grid-template-rows: 1fr; }
    body.capture header, body.capture footer { display: none; }
    #preview-label { display: none; position: fixed; right: 18px; bottom: 14px; color: #69756c; font-size: 10px; letter-spacing: .1em; pointer-events: none; }
    body.capture #preview-label { display: block; }
    @media (max-width: 600px) { header { padding: 22px 22px 0; } h1 { font-size: 18px; } footer { padding-bottom: 24px; } .hint { width: 100%; text-align: center; } }
  </style>
  <script type="importmap">
    {"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"}}
  </script>
</head>
<body>
  <main>
    <header><h1>古典庭园喷泉</h1><p>CLASSICAL GARDEN · A MINIATURE IN STONE & WATER</p></header>
    <div id="stage"><div id="status">正在载入庭园模型…</div></div>
    <footer>
      <button id="reset" disabled>复位视角</button>
      <button id="export" disabled>下载 GLB 模型</button>
      <span class="hint">拖动旋转 · 滚轮缩放</span>
    </footer>
  </main>
  <span id="preview-label">简化模型预览</span>
  <script type="module">
    const params = new URLSearchParams(location.search);
    if (params.has('capture')) document.body.classList.add('capture');
    const status = document.querySelector('#status');
    const timeout = setTimeout(() => { status.textContent = '模型载入超时，请检查网络后刷新。'; }, 20000);
    try {
      const [THREE, { OrbitControls }, { GLTFExporter }] = await Promise.all([
        import('three'), import('three/addons/controls/OrbitControls.js'), import('three/addons/exporters/GLTFExporter.js')
      ]);
      const stage = document.querySelector('#stage');
      const scene = new THREE.Scene();
      const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.25;
      stage.appendChild(renderer.domElement);
      const camera = new THREE.OrthographicCamera(-8, 8, 8, -8, .1, 100);
      const controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.enablePan = false;
      controls.minZoom = .8;
      controls.maxZoom = 2.5;
      controls.minPolarAngle = .35;
      controls.maxPolarAngle = Math.PI * .47;
      const garden = new THREE.Group();
      garden.name = 'Classical garden fountain miniature';
      scene.add(garden);
      const material = (color, roughness = .8, extra = {}) => new THREE.MeshStandardMaterial({ color, roughness, ...extra });
      const stone = material('#cec5ad');
      const paleStone = material('#e6dfcb');
      const stoneShadow = material('#a99f85');
      const paving = material('#d9d1bc');
      const soil = material('#748169');
      const leaf = material('#42694e');
      const leafLight = material('#5a815a');
      const bark = material('#827158');
      const bronze = material('#6c7868', .4, { metalness: .45 });
      const water = material('#65b7c4', .19, { metalness: .18, transparent: true, opacity: .84 });
      const jet = material('#b0eff1', .2, { metalness: .08, emissive: '#56858c', emissiveIntensity: .18, transparent: true, opacity: .88 });
      const add = (geometry, mat, x = 0, y = 0, z = 0, parent = garden) => {
        const mesh = new THREE.Mesh(geometry, mat);
        mesh.position.set(x, y, z);
        mesh.castShadow = mat !== water && mat !== jet;
        mesh.receiveShadow = true;
        parent.add(mesh);
        return mesh;
      };
      const box = (w, h, d, mat, x, y, z) => add(new THREE.BoxGeometry(w, h, d), mat, x, y, z);
      const cylinder = (r1, r2, h, mat, y, x = 0, z = 0, segments = 48) => add(new THREE.CylinderGeometry(r1, r2, h, segments), mat, x, y, z);
      const ring = (r, tube, mat, y) => { const m = add(new THREE.TorusGeometry(r, tube, 8, 64), mat, 0, y, 0); m.rotation.x = Math.PI / 2; return m; };
      const roundedTile = new THREE.Shape();
      const half = 4.4, radius = .38;
      roundedTile.moveTo(-half + radius, -half);
      roundedTile.lineTo(half - radius, -half);
      roundedTile.quadraticCurveTo(half, -half, half, -half + radius);
      roundedTile.lineTo(half, half - radius);
      roundedTile.quadraticCurveTo(half, half, half - radius, half);
      roundedTile.lineTo(-half + radius, half);
      roundedTile.quadraticCurveTo(-half, half, -half, half - radius);
      roundedTile.lineTo(-half, -half + radius);
      roundedTile.quadraticCurveTo(-half, -half, -half + radius, -half);
      const base = add(new THREE.ExtrudeGeometry(roundedTile, { depth: .3, bevelEnabled: true, bevelSegments: 1, steps: 1, bevelSize: .06, bevelThickness: .06 }), stoneShadow);
      base.rotation.x = -Math.PI / 2;
      base.position.y = -.3;
      box(8.6, .09, 8.6, paving, 0, .035, 0);
      // A circular promenade and four simple paths keep the miniature legible.
      cylinder(3.45, 3.45, .06, stone, .10);
      cylinder(3.22, 3.22, .065, paleStone, .105);
      ring(3.34, .035, stoneShadow, .15);
      for (let i = 0; i < 4; i++) {
        const path = box(1.12, .025, 2.1, paleStone, 0, .095, 3.3);
        path.position.set(Math.sin(i * Math.PI / 2) * 3.3, .095, Math.cos(i * Math.PI / 2) * 3.3);
        path.rotation.y = i * Math.PI / 2;
      }
      // Low enclosing walls, capped pillars, and planted corner beds.
      box(8.5, .62, .25, stone, 0, .4, -4.1);
      box(.25, .62, 8.2, stone, -4.1, .4, 0);
      box(.25, .62, 8.2, stone, 4.1, .4, 0);
      box(8.5, .12, .35, paleStone, 0, .77, -4.1);
      box(.35, .12, 8.2, paleStone, -4.1, .77, 0);
      box(.35, .12, 8.2, paleStone, 4.1, .77, 0);
      for (const x of [-4.1, 4.1]) for (const z of [-4.1, 4.1]) {
        box(.42, .93, .42, stone, x, .54, z);
        box(.55, .12, .55, paleStone, x, 1.06, z);
        add(new THREE.SphereGeometry(.15, 12, 8), paleStone, x, 1.26, z);
      }
      for (const x of [-3.45, 3.45]) for (const z of [-3.35, 3.35]) {
        box(1.05, .10, 1.06, soil, x, .13, z);
        box(1.15, .12, .10, stoneShadow, x, .15, z + .56);
        box(1.15, .12, .10, stoneShadow, x, .15, z - .56);
        box(.10, .12, 1.06, stoneShadow, x + .56, .15, z);
        box(.10, .12, 1.06, stoneShadow, x - .56, .15, z);
        const back = z < 0;
        cylinder(.10, .13, back ? 1.2 : .70, bark, back ? .78 : .53, x, z, 8);
        const crown = add(new THREE.IcosahedronGeometry(back ? .68 : .46, 1), leaf, x, back ? 1.95 : 1.22, z);
        crown.scale.set(1, 1.25, 1);
        add(new THREE.IcosahedronGeometry(back ? .50 : .33, 1), leafLight, x - .12, back ? 2.55 : 1.62, z - .02);
      }
      for (const x of [-3.52, 3.52]) {
        box(.55, .15, 1.30, bronze, x, .48, -.5);
        box(.10, .43, 1.3, bronze, x + Math.sign(x) * .24, .69, -.5);
        for (const z of [-.95, -.05]) box(.12, .36, .12, stoneShadow, x, .28, z);
      }
      // The pool has a stepped plinth, a carved rim and a clear water surface.
      cylinder(2.46, 2.55, .17, stoneShadow, .23);
      cylinder(2.35, 2.46, .15, paleStone, .39);
      cylinder(2.31, 2.34, .25, stone, .56);
      ring(2.30, .10, paleStone, .71);
      cylinder(2.19, 2.19, .055, water, .65);
      for (let i = 0; i < 32; i++) {
        const a = i / 32 * Math.PI * 2;
        const detail = box(.085, .13, .04, stoneShadow, Math.sin(a) * 2.33, .55, Math.cos(a) * 2.33);
        detail.rotation.y = a;
      }
      cylinder(.51, .65, .17, paleStone, .79);
      cylinder(.23, .40, .53, stone, 1.10);
      const bowl = (r, y) => {
        const profile = [[0, -.19], [.24 * r, -.19], [.42 * r, -.14], [.72 * r, -.04], [.96 * r, .12], [r, .18], [r, .24], [.91 * r, .24], [.88 * r, .16], [.64 * r, .025], [.24 * r, -.055], [0, -.055]].map(([x, yy]) => new THREE.Vector2(x, yy));
        add(new THREE.LatheGeometry(profile, 48), paleStone, 0, y, 0);
        cylinder(r * .9, r * .9, .035, water, y + .16);
        ring(r * .97, .055, stone, y + .235);
      };
      bowl(1.30, 1.44);
      cylinder(.17, .28, .70, stone, 1.96);
      bowl(.72, 2.40);
      cylinder(.10, .16, .23, paleStone, 2.68);
      const tube = (curve, width, segments = 24) => add(new THREE.TubeGeometry(curve, segments, width, 5, false), jet);
      // Static curved tubes replace particles and export directly to glTF.
      for (let i = 0; i < 8; i++) {
        const a = i / 8 * Math.PI * 2, sx = Math.sin(a), sz = Math.cos(a);
        tube(new THREE.CubicBezierCurve3(
          new THREE.Vector3(sx * .97, 1.62, sz * .97),
          new THREE.Vector3(sx * 1.24, 2.75, sz * 1.24),
          new THREE.Vector3(sx * 1.89, 2.29, sz * 1.89),
          new THREE.Vector3(sx * 2.04, .72, sz * 2.04)
        ), .032);
        tube(new THREE.CubicBezierCurve3(
          new THREE.Vector3(sx * .56, 2.57, sz * .56),
          new THREE.Vector3(sx * .72, 2.81, sz * .72),
          new THREE.Vector3(sx * .81, 2.08, sz * .81),
          new THREE.Vector3(sx * .84, 1.63, sz * .84)
        ), .024, 16);
      }
      tube(new THREE.CubicBezierCurve3(new THREE.Vector3(0, 2.79, 0), new THREE.Vector3(-.045, 3.40, 0), new THREE.Vector3(-.015, 4.0, 0), new THREE.Vector3(.05, 4.12, 0)), .060, 28);
      for (let i = 0; i < 5; i++) {
        const a = i / 5 * Math.PI * 2;
        tube(new THREE.CubicBezierCurve3(new THREE.Vector3(.05, 4.07, 0), new THREE.Vector3(Math.sin(a) * .22, 4.31, Math.cos(a) * .22), new THREE.Vector3(Math.sin(a) * .33, 3.64, Math.cos(a) * .33), new THREE.Vector3(Math.sin(a) * .27, 2.61, Math.cos(a) * .27)), .018, 22);
      }
      for (const [r, y] of [[1.78, .688], [1.54, .688], [.91, 1.633], [.43, 2.593]]) ring(r, .010, jet, y);
      scene.add(new THREE.HemisphereLight('#ffffff', '#a4ac89', 2.6));
      const sun = new THREE.DirectionalLight('#fff2d3', 3.4);
      sun.position.set(-3, 9, 5);
      sun.castShadow = true;
      sun.shadow.mapSize.set(1024, 1024);
      Object.assign(sun.shadow.camera, { left: -7, right: 7, top: 7, bottom: -7, near: .1, far: 25 });
      sun.shadow.bias = -.0006;
      sun.shadow.normalBias = .025;
      scene.add(sun);
      const fill = new THREE.DirectionalLight('#d4eeff', 1.2);
      fill.position.set(5, 5, -6);
      scene.add(fill);
      const shadow = add(new THREE.PlaneGeometry(200, 200), new THREE.ShadowMaterial({ color: '#4b5b4e', opacity: .13 }), 0, -.375, 0, scene);
      shadow.rotation.x = -Math.PI / 2;
      shadow.castShadow = false;
      const target = new THREE.Vector3(0, 1.55, 0);
      const reset = () => { camera.position.set(10, 9.4, 12); controls.target.copy(target); camera.zoom = 1; camera.updateProjectionMatrix(); controls.update(); };
      reset();
      const resize = () => {
        const w = stage.clientWidth, h = stage.clientHeight, aspect = w / h;
        // Fit a bounding sphere, preserving every wall and tree on narrow phones.
        const halfHeight = Math.max(6.85, 6.85 / aspect);
        camera.left = -halfHeight * aspect; camera.right = halfHeight * aspect;
        camera.top = halfHeight; camera.bottom = -halfHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(w, h);
      };
      new ResizeObserver(resize).observe(stage);
      resize();
      renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });
      document.querySelector('#reset').disabled = false;
      document.querySelector('#reset').onclick = reset;
      const exportButton = document.querySelector('#export');
      exportButton.disabled = false;
      exportButton.onclick = async () => {
        exportButton.disabled = true;
        try {
          const glb = await new GLTFExporter().parseAsync(garden, { binary: true });
          const url = URL.createObjectURL(new Blob([glb], { type: 'model/gltf-binary' }));
          const a = document.createElement('a');
          a.href = url; a.download = 'classical-garden-fountain.glb'; a.click();
          setTimeout(() => URL.revokeObjectURL(url), 1000);
        } catch (error) { status.hidden = false; status.textContent = `模型导出失败：${error.message}`; }
        finally { exportButton.disabled = false; }
      };
      window.fountainPreview = { scene, camera, renderer, garden, exportGLB: () => new GLTFExporter().parseAsync(garden, { binary: true }) };
      clearTimeout(timeout);
      status.hidden = true;
      document.documentElement.dataset.previewReady = 'true';
    } catch (error) {
      clearTimeout(timeout);
      status.textContent = `无法载入 3D 模型：${error.message}。请确认网络及浏览器 WebGL 可用。`;
    }
  </script>
</body>
</html>
