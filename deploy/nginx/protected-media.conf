# Include inside the API HTTPS server block. Replace any existing /media/ CDN
# redirect: mutable uploads and private references require a live access check.
location ^~ /media/ {
    proxy_pass http://127.0.0.1:5273;
    include /www/wwwroot/arenaofbias-server/deploy/nginx/api-proxy.conf;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
}
